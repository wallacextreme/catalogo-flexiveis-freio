# Workflow oficial para publicar o PWA no GitHub Pages
# Caso deseje ativar o deploy automático pelo GitHub Actions:
# 1. Mova este arquivo para .github/workflows/deploy.yml
# 2. No repositório GitHub -> Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Quality Gate Tests
        run: bun test

      - name: Build PWA for GitHub Pages
        run: bun run build --base=/${{ github.event.repository.name }}/
        env:
          GITHUB_PAGES: 'true'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
